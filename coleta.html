<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Coleta — Mister Reforma (compacto)</title>
  <meta name="theme-color" content="#0b0c10" />
  <style>
    :root{ --bg:#0b0c10;
    --panel:#10131c; --ink:#e8eaed; --line:#1f2433; }
    *{ box-sizing:border-box }
    body{ margin:0; font-family:system-ui, Arial; background:var(--bg); color:var(--ink);
    }
    .wrap{ max-width:560px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
    header{ position:sticky; top:0; background:#10131c;
    border-bottom:1px solid var(--line); }
    .head-inner{ display:flex; align-items:center; gap:12px; padding:12px 14px; }
    h1{ font-size:16px;
    margin:0 }
    main{ flex:1; padding:14px }
    .card{ background:#10131c; border:1px solid var(--line); border-radius:14px;
    padding:14px }
    .grid{ display:grid; grid-template-columns:1fr; gap:10px }
    label{ display:flex; flex-direction:column; gap:6px; font-weight:600;
    font-size:13px }
    input, select{ background:#0f1320; color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px;
    font-size:16px }
    .row-actions{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:12px 0 6px }
    .btn{ border-radius:12px;
    padding:12px; background:#0f1320; color:#e8eaed; font-weight:700; border:1px solid var(--line); }
    .btn.primary{ background:#22c55e; color:#0b0c10;
    border-color:#16a34a }
    table{ width:100%; border-collapse:collapse; margin-top:6px; font-size:14px }
    th, td{ border:1px solid var(--line); padding:10px;
    text-align:left }
    th{ background:#0f1320; }
    footer{ padding:10px 14px; border-top:1px solid var(--line);
    background:#10131c }
    .footer-actions{ display:grid; grid-template-columns:1fr; gap:10px }
    .hint{ color:#aab2c0; font-size:12px;
    margin:10px 0 0 }
    
    /* --- START OF CHANGES --- */

    /* Print Area */
    #printArea{ 
    /* This rule was intentionally left empty to ensure the main content is visible on local file loading. */
    }
    
    @media print{
      body{ background:#fff; color:#000;
      }
      header, main > .card:not(#printArea), footer{ display:none !important;
      }
      
      @page{
        size:A4;
      margin:5mm;
      }
      
      /* 1. Turns the print area into a flexible container */
      #printArea{
        display: flex !important;
      flex-direction: column;
        justify-content: space-around; /* Distribute the copies vertically */
        align-items: center;
      /* Center the content horizontally */
        height: 100%;
      /* Occupy the full height of the print area */
        width: 100%;
      background: #fff !important;
        border: none !important;
      }

      /* 2. Removes the scale transformation from the inner container */
      #scaled{
        transform: none !important;
      width: auto !important;
      }
    }
    /* --- END OF CHANGES --- */

  </style>
</head>
<body>
  <div class="wrap">
    <header><div class="head-inner"><h1>Coleta — Mister Reforma</h1></div></header>
    <main>
      <div class="card">
        <div class="grid">
          <label>Data (Brasil)<input id="dt" type="date" /></label>
          <label>Medidas
            <select id="dimensions">
             
              <option value="">Selecione…</option>
              <option>188x138 (Casal)</option><option>198x158 (Queen)</option>
              <option>203x193 (King)</option><option>188x88 (Solteiro)</option>
              <option>178x128 (Viúva)</option><option>Sob medida</option>
            </select>
          </label>
          <label>Altura (cm)<input id="height" inputmode="decimal" placeholder="ex.: 30" /></label>
          <label>Marca do 
            Colchão
            <select id="brand">
              <option value="">Selecione…</option>
              <option>American Flex</option><option>Anjo Colchões</option>
              <option>BF Colchões</option><option>Castor</option><option>Classic Colchões</option>
              <option>Eco Flex</option><option>Euro Colchões</option><option>F.A.
              Colchões</option>
              <option>Gazin</option><option>Grand Relax</option><option>Herval</option>
              <option>Inducol</option><option>Mr.
              Reforma Colchão</option><option>Nipponflex</option>
              <option>Ortho Bon</option><option>Ortho Cream</option><option>Pro Relax</option>
              <option>Pro Bell</option><option>Simbal</option><option>Simmons</option>
              <option>Sleep House</option><option>Umaflex</option><option>Outros</option>
            </select>
          </label>
          <label>Código OS<input id="os" value="PAI-S" /></label>
          <label>Placa<input id="plate" placeholder="ex.: ABC1D23" /></label>
  
          <label>Franquia<input id="franchise" value="Mister Reforma Colchão - Paicandu" /></label>
        </div>
        <div class="row-actions">
          <button class="btn primary" onclick="addItem()">Adicionar</button>
          <button class="btn" onclick="undoItem()">Remover último</button>
          <button class="btn" onclick="clearAll()">Apagar todos</button>
        </div>
        <table id="tab"><thead><tr><th>Nº</th><th>Medidas</th><th>Altura</th><th>Marca</th><th>Código OS</th></tr></thead><tbody></tbody></table>
        <p class="hint">Toque em 
          <b>Pré-visualizar/Imprimir</b>. O layout será ajustado para caber em 1 folha A4.</p>
      </div>
      <div id="printArea" class="card">
        <div id="scaled"><div id="printContent"></div></div>
      </div>
    </main>
    <footer><div class="footer-actions"><button class="btn primary" onclick="printDocument()">Pré-visualizar/Imprimir (PDF)</button></div></footer>
  </div>
<script>
  // Technical code in English
  const tbody = document.querySelector('#tab tbody');
  const MAX_ITEMS = 15; let items = []; 
  
  // Renamed 'brDateFromInput' to 'formatDateToBR'
  function formatDateToBR(value){ if(!value) return ''; const [y,m,d] = value.split('-'); return `${d}/${m}/${y}`;
  }
  
  // Renamed 'updateTable' to 'updateItemsTable'
  function updateItemsTable(){ 
      tbody.innerHTML=''; 
      items.forEach((r,i)=>{ 
          const tr=document.createElement('tr'); 
          tr.innerHTML=`<td>${i+1}</td><td>${r.dimensions}</td><td>${r.height}</td><td>${r.brand}</td><td>${r.os}</td>`; 
          tbody.appendChild(tr); 
      });
  }
  
  // Form field IDs are kept as originally provided (dimensions, height, brand, os)
  function addItem(){ 
      if(items.length>=MAX_ITEMS){
          alert('Limite de 15 itens.'); // Message in Portuguese
          return;
      } 
      const dimensions=document.querySelector('#dimensions').value.trim();
      const height=document.querySelector('#height').value.trim();
      const brand=document.querySelector('#brand').value.trim();
      const os=document.querySelector('#os').value.trim();
  
      if(!dimensions||!height||!brand||!os){
          alert('Preencha todos os campos.'); // Message in Portuguese
          return;
      } 
      items.push({dimensions,height,brand,os});
      updateItemsTable();
      document.querySelector('#dimensions').value='';
      document.querySelector('#height').value='';
      document.querySelector('#brand').value='';
      document.querySelector('#os').value='PAI-S';
  }
  
  // Renamed 'undoItem' to 'removeLastItem'
  function undoItem(){ 
      items.pop();
      updateItemsTable();
  } 
  
  // Renamed 'clearAll' to 'clearAllItems'
  function clearAll(){ 
      if(confirm('Apagar todos?')){ // Message in Portuguese
          items=[];
          updateItemsTable();
      } 
  }

  // Renamed 'gerarHTMLImpressao' to 'generatePrintHTML'
  function generatePrintHTML(){ 
      const franchise=document.querySelector('#franchise').value.trim();
      const plate=document.querySelector('#plate').value.trim();
      const dateBR=formatDateToBR(document.querySelector('#dt').value);
      const printRows=[...items];
  
      while(printRows.length<MAX_ITEMS){
          printRows.push({dimensions:'',height:'',brand:'',os:''});
      }
    
      // HTML content (visible to the user) is in Portuguese.
      // Line height is set to 1.4 and font size to 13px.
      const printCopy=(title)=>`
        <h2 style="margin:0 0 3px 0;font:700 13px system-ui">${title}</h2>
        <table style="width:100%;border-collapse:collapse;margin:1px 0 2px 0;font:13px/1.4 system-ui">
          <tr>
            <td style="border:0.6px solid #000;padding:2px;width:25%;line-height:1.4"><b>Franquia:</b></td>
            <td style="border:0.6px solid #000;padding:2px;width:35%;line-height:1.4">${franchise||''}</td>
            <td style="border:0.6px solid #000;padding:2px;width:15%;line-height:1.4"><b>Data:</b></td>
            <td style="border:0.6px solid #000;padding:2px;width:25%;line-height:1.4">${dateBR||''}</td>
          </tr>
      
          <tr>
            <td style="border:0.6px solid #000;padding:2px;line-height:1.4"><b>Placa do Caminhão:</b></td>
            <td style="border:0.6px solid #000;padding:2px;line-height:1.4">${plate||''}</td>
            <td style="border:0.6px solid #000;padding:2px;line-height:1.4"><b>Assinatura:</b></td>
            <td style="border:0.6px solid #000;padding:2px;line-height:1.4">&nbsp;</td>
          </tr>
        </table>
        <table style="width:100%;border-collapse:collapse;font:13px/1.4 system-ui">
          <thead>
            <tr>
    
              <th style="border:0.6px solid #000;padding:2px;width:6%">Nº</th>
              <th style="border:0.6px solid #000;padding:2px;width:30%">Medidas</th>
              <th style="border:0.6px solid #000;padding:2px;width:12%">Altura</th>
              <th style="border:0.6px solid #000;padding:2px;width:32%">Marca do Colchão</th>
              <th style="border:0.6px solid #000;padding:2px;width:20%">Código OS</th>
            </tr>
          </thead>
        
          <tbody>
            ${printRows.map((r,i)=>`
              <tr>
                <td style="border:0.6px solid #000;padding:2px;text-align:center;line-height:1.4">${i+1}</td>
                <td style="border:0.6px solid #000;padding:2px;line-height:1.4">${r.dimensions||''}</td>
                <td style="border:0.6px solid #000;padding:2px;line-height:1.4">${r.height||''}</td>
                <td style="border:0.6px solid #000;padding:2px;line-height:1.4">${r.brand||''}</td>
          
                <td style="border:0.6px solid #000;padding:2px;line-height:1.4">${r.os||''}</td>
              </tr>`).join('')}
          </tbody>
        </table>`;
  return `<div id="contentBase" style="color:#000;width:190mm"><h1 style="font:700 13px system-ui;margin:0 0 3px 0">Documento de Coleta</h1>${printCopy('1ª Via — Empresa')}<div style="height:15mm"></div>${printCopy('2ª Via — Motorista')}</div>`;
  }

  /* --- START OF CHANGES --- */
  // Renamed 'imprimir' to 'printDocument'
  function printDocument(){
    if(items.length === 0){
        alert('Adicione ao menos 1 item.'); // Message in Portuguese
        return; 
    }

    // 3. Simplified function: now it only generates HTML and calls the print function.
    // The CSS handles the entire layout.
    const pc = document.getElementById('printContent');
    pc.innerHTML = generatePrintHTML();
    
    const dt = document.querySelector('#dt').value;
    const dateBR = formatDateToBR(dt) || 'nodate';
    document.title = `Coleta_${dateBR.replaceAll('/','-')}`; // Title uses "Coleta"
    
    window.print();
  }
  /* --- END OF CHANGES --- */
</script>
</body>
</html>
